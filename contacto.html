  <!-- Modo de la página (como la home): cine (Lenis + Three) o fijo (movimiento reducido, ahorro de datos). ?modo=fijo | ?modo=cine -->
  <script>
    (function () {
      var EV = (window.EV = window.EV || {}), q = new URLSearchParams(location.search).get('modo');
      var rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      var c = navigator.connection || {}, lenta = c.saveData || /(^|-)(2g|3g)$/.test(c.effectiveType || '');
      EV.reducedMotion = rm;
      EV.mode = q === 'fijo' ? 'still' : q === 'cine' ? 'cine' : (rm || lenta) ? 'still' : 'cine';
      document.documentElement.classList.add(EV.mode === 'cine' ? 'is-cine' : 'is-still');
      if (window.matchMedia) matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', function () { if (!q) location.reload(); });
    })();
  </script>

<body class="inicio pag pag--contacto" data-fondo-op="0.5">
  <div class="bg-grid" aria-hidden="true"></div>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <!-- ===== Fondo global (el mismo de la home): negro con líneas finas + la onda de cromo (Three.js) + grano ===== -->
  <div class="fondo" aria-hidden="true">
    <picture class="fondo__fija">
      <source media="(max-width: 719px)" type="image/webp" srcset="assets/onda/onda-movil.webp">
      <img src="assets/onda/onda-escritorio.webp" alt="" width="1920" height="1080" decoding="async" fetchpriority="high">
    </picture>
    <canvas class="fondo__onda"></canvas>
  </div>
  <div class="grano" aria-hidden="true"></div>

  <!-- ===== Cabecera (la misma en todas las páginas): EVIMES a la izquierda y los enlaces centrados en una píldora de cristal. En móvil, "Menú" a la derecha ===== -->
  <header class="cabecera">
    <a class="cabecera__marca" href="index.html" aria-label="Evimes, inicio">EVIMES</a>
    <button class="cabecera__abrir" type="button" aria-expanded="false" aria-controls="cabecera-nav">Menú</button>
    <nav class="cabecera__nav" id="cabecera-nav" aria-label="Principal">
      <ul>
        <li><a href="laboratorio.html" data-scramble><span class="sl">Laboratorio</span></a></li>
        <li><a href="planes.html" data-scramble><span class="sl">Planes</span></a></li>
        <li><a href="contacto.html" data-scramble aria-current="page"><span class="sl">Contacto</span></a></li>
      </ul>
    </nav>
  </header>

  <main id="contenido">
    <!-- BORRADOR: textos en js/data/contacto-pagina.js -->
    <!-- 1 · Cabecera -->
    <section class="pag-hero pag-hero--contacto" aria-labelledby="h1">
      <h1 class="display pag-hero__titulo" id="h1" data-ct="hero.titulo" data-lineas>¿Hacemos que se te vea?</h1>
      <p class="pag-hero__texto" data-ct="hero.texto">Cuéntanos qué necesitas. Te respondemos con una propuesta clara.</p>
    </section>

    <!-- 2 · Formulario: el mismo de la home (Web3Forms, clave en js/config.js), en su card de cristal -->
    <section class="contacto contacto--pagina" id="formulario" aria-label="Formulario de contacto">
      <div class="contacto__form form-card con-luz" data-form-caja>
        <form class="form" data-form data-form-ir="formulario" novalidate aria-describedby="form-nota">
          <!-- trampa para bots (Web3Forms): oculta para personas y lectores de pantalla -->
          <input class="form__hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
          <!-- plan (?plan=… o los botones de los planes) y perfil (los CTA de Con quién): ocultos -->
          <input type="hidden" name="plan" value="">
          <input type="hidden" name="perfil" value="">

          <div class="campo">
            <label class="campo__label" for="f-nombre">Nombre <span aria-hidden="true">*</span></label>
            <input class="campo__input" id="f-nombre" name="nombre" type="text" autocomplete="name" required aria-describedby="f-nombre-err">
            <p class="campo__error" id="f-nombre-err"></p>
          </div>
          <div class="campo">
            <label class="campo__label" for="f-empresa">Nombre de la empresa <span aria-hidden="true">*</span></label>
            <input class="campo__input" id="f-empresa" name="empresa" type="text" autocomplete="organization" required aria-describedby="f-empresa-err">
            <p class="campo__error" id="f-empresa-err"></p>
          </div>
          <div class="campo">
            <label class="campo__label" for="f-email">Email <span aria-hidden="true">*</span></label>
            <input class="campo__input" id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="f-email-err">
            <p class="campo__error" id="f-email-err"></p>
          </div>
          <div class="campo">
            <label class="campo__label" for="f-telefono">Teléfono <span class="campo__opc">(opcional)</span></label>
            <input class="campo__input" id="f-telefono" name="telefono" type="tel" autocomplete="tel" inputmode="tel" aria-describedby="f-telefono-err">
            <p class="campo__error" id="f-telefono-err"></p>
          </div>
          <div class="campo campo--area">
            <label class="campo__label" for="f-mensaje">Cuéntanos de qué va tu empresa <span class="campo__opc">(opcional)</span></label>
            <textarea class="campo__input" id="f-mensaje" name="mensaje" rows="3" aria-describedby="f-mensaje-err"></textarea>
            <p class="campo__error" id="f-mensaje-err"></p>
          </div>

          <div class="casilla">
            <input id="f-privacidad" name="privacidad" type="checkbox" required aria-describedby="f-privacidad-err">
            <label for="f-privacidad">He leído y acepto la <a href="privacidad.html">política de privacidad</a>. <span aria-hidden="true">*</span></label>
            <p class="campo__error" id="f-privacidad-err"></p>
          </div>

          <div class="form__pie">
            <button class="pastilla pastilla--grande form__enviar" type="submit" data-scramble><span class="sl">Enviar</span></button>
            <p class="form__nota" id="form-nota">Los campos con * son obligatorios.</p>
          </div>
          <div class="form__estado" data-form-estado role="status" aria-live="polite"></div>
        </form>
      </div>
      <!-- WhatsApp y email salen de js/config.js; vacíos, no se muestran -->
      <p class="contacto__directo contacto__directo--linea" data-directo hidden>
        <a data-whatsapp href="#" target="_blank" rel="noopener" hidden>WhatsApp</a>
        <a data-email href="#" hidden></a>
      </p>
    </section>
  </main>
